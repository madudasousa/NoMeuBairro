<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoMeuBairro - Login e Cadastro</title>
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>

<header class="home-header" onclick="window.location.href='/home.html'" style="cursor:pointer;">
    <div class="brand">
        <div class="brand__icon">
            <img src="/img/logo.png" alt="NoMeuBairro" class="brand__logo" />
        </div>
        <div class="brand__text">
            <h1 class="brand__title">NoMeuBairro</h1>
            <p class="brand__subtitle">Conectando você ao comercios locais</p>
        </div>
    </div>
</header>

<main class="main-container">
    <div class="card-auth">

        <!-- TELA DE LOGIN -->
        <div id="section-login">
            <h2>Acessar sua Conta</h2>
            <form id="form-login">
                <div class="form-group">
                    <label for="login-identificador">CPF ou CNPJ</label>
                    <input type="text" id="login-identificador" placeholder="Digite seu documento" required>
                    <small class="error-msg" id="erro-identificador"></small>
                </div>

                <div class="form-group">
                    <label for="login-senha">Senha</label>
                    <input type="password" id="login-senha" placeholder="Digite sua senha" required>
                    <small class="error-msg" id="erro-senha"></small>
                </div>

                <small class="error-msg" id="erro-login-geral"></small>

                <button type="submit" class="btnLC btn-primary">Entrar</button>
                <button type="button" class="btnLC btn-outline" onclick="alternarTelas()">Criar uma Conta</button>
            </form>
        </div>

        <!-- TELA DE CADASTRO -->
        <div id="section-cadastro" class="hidden">
            <h2>Cadastre-se no Sistema</h2>
            <form id="form-cadastro">

                <div class="form-group">
                    <label for="cad-perfil">Você é:</label>
                    <select id="cad-perfil" onchange="adaptarLabels()" required>
                        <option value="cliente">Cliente (Consumidor)</option>
                        <option value="estabelecimento">Estabelecimento (Comércio)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label id="label-nome" for="cad-nome">Nome Completo</label>
                    <input type="text" id="cad-nome" placeholder="Digite o nome completo" required>
                </div>

                <div class="form-group">
                    <label id="label-doc" for="cad-doc">CPF</label>
                    <input type="text" id="cad-doc" placeholder="000.000.000-00" required>
                </div>

                <div class="form-group">
                    <label id="label-data" for="cad-data">Data de Nascimento</label>
                    <input type="date" id="cad-data" required>
                </div>

                <div class="form-group">
                    <label for="cad-senha">Crie uma Senha</label>
                    <input type="password" id="cad-senha" placeholder="Mínimo 6 caracteres" required>
                </div>

                <small class="error-msg" id="erro-cadastro-geral"></small>

                <button type="submit" class="btnLC btn-primary">Finalizar Cadastro</button>
                <button type="button" class="btnLC btn-secondary" onclick="alternarTelas()">Voltar para o Login</button>
            </form>
        </div>

    </div>
</main>

<script src="/login.js"></script>
</body>
</html>
