<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoMeuBairro - Login</title>
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>

<header class="home-header" onclick="window.location.href='/home.html'" style="cursor:pointer;">
    <div class="brand">
        <div class="brand__icon">
            <img src="/img/logo.png" alt="NoMeuBairro" class="brand__logo" />
        </div>
        <div class="brand__text">
            <h1 class="brand__title">NoMeuBairro</h1>
            <p class="brand__subtitle">Conectando você ao comercios locais</p>
        </div>
    </div>
</header>

<main class="main-container">
    <div class="card-auth">

        <!-- TELA DE LOGIN -->
        <div id="section-login">
            <h2>Acessar sua Conta</h2>
            <form id="form-login">
                <div class="form-group">
                    <label for="login-identificador">CPF ou CNPJ</label>
                    <input type="text" id="login-identificador" placeholder="Digite seu documento" required>
                    <small class="error-msg" id="erro-identificador"></small>
                </div>

                <div class="form-group">
                    <label for="login-senha">Senha</label>
                    <input type="password" id="login-senha" placeholder="Digite sua senha" required>
                    <small class="error-msg" id="erro-senha"></small>
                </div>

                <small class="error-msg" id="erro-login-geral"></small>

                <button type="submit" class="btnLC btn-primary">Entrar</button>
                <button type="reset" class="btn btn--ghost" id="cancelBtn">Cancelar</button>
            </form>
        </div>

    </div>
</main>

<script src="/login.js"></script>
</body>
</html>
