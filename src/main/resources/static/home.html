<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoMeuBairro</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="home-page">
    <main class="home-container">
      <!-- TOPO -->
      <header class="home-header">
        <div class="brand">
          <div class="brand__icon">
            <img src="/img/logo.png" alt="NoMeuBairro" class="brand__logo" />
          </div>

          <div class="brand__text">
            <h1 class="brand__title">NoMeuBairro</h1>
            <p class="brand__subtitle">Conectando você ao comercios locais</p>
          </div>
        </div>

        <div class="header__auth" id="headerAuth"></div>
      </header
      <!-- Dropdown do menu do usuário logado — oculto por padrão -->
      <div class="auth-dropdown" id="authDropdown">
        <div class="auth-dropdown__name" id="authDropdownName"></div>
        <a class="auth-dropdown__item" id="authDropdownLoja" href="#">🏪 Minha Loja</a>
        <button class="auth-dropdown__item auth-dropdown__logout" id="authLogoutBtn">🚪 Sair</button>
      </div>
      <!-- HERO / BANNER -->
      <section class="hero">
        <h2 class="hero__title">Descubra os Comércios do Seu Bairro</h2>
        <p class="hero__text">
          Encontre facilmente pizzarias, mercados, oficinas, salões e muito mais
          na sua região
        </p>

        <form class="search-box" id="searchForm">
          <input
            type="text"
            id="searchInput"
            class="search-box__input"
            placeholder="Buscar por tipo de comércio"
          />
          <button type="submit" class="search-box__button">Buscar</button>
        </form>

        <p class="hero__small">Seu comércio local, mais perto de você</p>
      </section>

      <!-- CATEGORIAS -->
      <section class="categories">
        <div class="categories__tags" id="categoryTags">
        </div>
      </section>

      <!-- LISTA DAS SEÇÕES -->
      <section id="sectionsContainer" class="sections-container"></section>

      <div class="cadastrar-btn-wrap">
        <button class="btn-cadastrar-estab" id="btnCadastrarEstab">
          PARA CADASTRAR SEU ESTABELECIMENTO, CLIQUE AQUI
          OU ENTRE EM CONTATO PELO NUMERO (11) 99999-9999
        </button>
      </div>
    </main>

    <script src="/home.js"></script>
  </body>
</html>
